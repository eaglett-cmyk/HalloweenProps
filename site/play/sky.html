<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex">

<link rel="icon" href="/img/prop_crystal.webp" type="image/webp">

<body class="play-page">

<main class="pl-main pl-wide">
  <header class="pl-head">
    <a class="pl-back" href="/play/">&#x2039; All the games</a>
    <h1 class="pl-title">The Crystal Sky</h1>
    <p class="pl-lede" id="sky-lede">Every crystal that has woken Butterscotch shines up here. The brighter the star, the higher its rank.</p>
    <p class="pl-crystal" id="pl-crystal"></p>
  </header>

  <div class="pl-stage" id="stage">
    <canvas id="cv" aria-label="A night sky full of crystal stars above the hill where the dragon's cave glows"></canvas>
    <div class="pl-hud"><span id="sky-count"></span><span id="sky-beacon"></span></div>
  </div>
  <p class="pl-help" id="sky-tip">Tap a star to see whose glow it is. Silver, gold, ruby and green are the prizes each crystal found last; a lilac star is still waiting to wake the dragon.</p>
</main>

<script src="/play/play.js?v=4"></script>
